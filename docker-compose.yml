services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # чтобы health-сервер поднялся и Docker видел живой процесс
      PORT: "8080"
      DB_PATH: /app/data/leads.sqlite3
    volumes:
      # база и сессия переживают перезапуск контейнера
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
