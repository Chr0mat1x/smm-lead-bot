services:
  - type: web
    name: smm-bot
    runtime: python
    # бесплатный тариф; на нём нет постоянного диска, база обнуляется при деплое
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m smm_bot.bot
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: LLM_PROVIDER
        value: pollinations
      # sync: false — Render спросит эти значения при создании сервиса.
      # Без пометки переменные не спросят, бот стартует без токена и упадёт.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_USER_IDS
        sync: false
      - key: YOUR_NAME
        sync: false
      - key: YOUR_CONTACT
        sync: false
